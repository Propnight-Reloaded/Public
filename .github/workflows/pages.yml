name: Pages
# Publie tout le dépôt sur GitHub Pages (miroir de bootstrap/, wiki/ et patchnotes/) à chaque push sur main.
# renew.yml publie aussi après son commit hebdomadaire : un commit fait par GITHUB_TOKEN ne déclenche pas ce workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: pages
  cancel-in-progress: false
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  # Déploiement dans un job à part : dans le même job, deploy-pages ne trouve parfois pas l'artefact qui vient
  # d'être envoyé (actions/deploy-pages#451)
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
